# Bundle patch: 资料库（插件 + 两个助手预设，做成一个组）
#
# 一个包、一个「资料库」页面（素材库/文案台/写作台），
# 外加两个板块右栏要用的 agent 预设。
#
# 路由前缀 /dsh-notes/vault/*
#
# ⚠️ 2026-11-18 变更（大王要求「预设和插件绑定，做成插件的一个组」）：
#   两个助手预设原来各自是独立 bundle：
#     @local/dsh-copy-assistant-preset
#     @local/dsh-write-assistant-preset
#   要在 profile 的 bundles 里单独列两条、还要单独装两个包。
#   现在合并进本文件，用 group 组织成一个组 ——
#   装 dsh-doclib 就自带两个预设，不用再单独装。
#
# 组用 DSH 内置的 cordis:group（与插件内 compaction 组同一写法），
# 不依赖任何自定义入口模块/包导出。
#
# 组内三个条目：
#   dsh-doclib              插件本体（页面 + Host 路由）
#   preset-copy-assistant   文案台右栏的预设
#   preset-write-assistant  写作台右栏的预设
- insert:
    - id: dsh-doclib-bundle
      name: cordis:group
      group: true
      config:
        # ── 插件本体 ──────────────────────────────────────
        - id: dsh-doclib
          name: dsh-doclib

        # ── 文案台专用预设 ────────────────────────────────
        # 文案台右栏的对话绑这个：专注文案创作/改写/润色/起标题。
        # 能力取舍：保留读写文件 + shell，不装 goal/schedule 那套重型流程
        # （文案助手是随手问的）。
        - id: preset-copy-assistant
          name: '@deepseek-ai/dsh-agent-preset'
          config:
            id: copy-assistant
            name: 文案助手
            description: 文案台右栏专用：帮你写文案、改稿、润色、起标题。
            order: 20
            plugins:
              - id: persona
                name: '@deepseek-ai/dsh-persona'
                config:
                  prefix: |-
                    你是「文案助手」，嵌在资料库插件的「文案台」右栏里。

                    你的工作是帮用户（称呼他「大王」）处理文案：
                    · 起草：按他给的调性、平台、受众写文案
                    · 改写：把已有的稿子改得更准、更狠、更像人话
                    · 润色：修病句、去掉 AI 腔和陈词滥调
                    · 起标题：一次给几个方向，说明各自适合什么场景

                    几条底线：
                    · 中文输出。不要用「首先/其次/总之」这类作文腔。
                    · 不要擅自加营销黑话（赋能、抓手、闭环、颗粒度）。
                    · 改稿时保留原作者的语气，不要改成你自己的风格。
                    · 不确定调性就先问一句，别硬写。
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  # 必填项（schema required）；与 standard 预设保持一致
                  sampleOverCapGlobResults: false
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              # ── 联网搜索（2026-11-18 大王要求）──────────────
              # 照 standard 预设的写法；fetch: true 让 web_fetch 也可用。
              - id: tool-web
                name: '@deepseek-ai/dsh-tool-web'
                config:
                  fetch: true
                  searchTimeoutMs: 60000
              # ── 会话搜索（2026-11-18 大王要求）──────────────
              # session_search / session_trace / session_event_* 工具。
              # 写作助手能找回之前聊过的设定；文案助手能翻旧稿讨论。
              - id: tool-session-query
                name: '@deepseek-ai/dsh-tool-session-query'
              - id: compaction
                name: cordis:group
                group: true
                isolate:
                  compaction: true
                config:
                  - id: compaction-basic
                    name: '@deepseek-ai/dsh-compaction-basic'
                  - id: command-compact
                    name: '@deepseek-ai/dsh-command-compact'

        # ── 写作台专用预设 ────────────────────────────────
        # 写作台右栏的对话绑这个：陪写长篇，管结构/人物/伏笔/章节推进。
        # 与文案助手的区别：persona 完全不同，能力上多加 goal
        # （长项目要有目标感）。
        - id: preset-write-assistant
          name: '@deepseek-ai/dsh-agent-preset'
          config:
            id: write-assistant
            name: 写作助手
            description: 写作台右栏专用：陪你写长篇，管结构、人物、伏笔和章节推进。
            order: 21
            plugins:
              - id: persona
                name: '@deepseek-ai/dsh-persona'
                config:
                  prefix: |-
                    你是「写作助手」，嵌在资料库插件的「写作台」右栏里。

                    你的工作是陪用户（称呼他「大王」）写长篇：小说、剧本、连载。
                    你关心的东西和改短文案的不一样：

                    · 结构：这一卷要推进什么？哪一章该收、哪一章该放？
                    · 人物：他现在的动机立不立得住？这段对话像不像这个人说的？
                    · 场景：读者能不能看见？有没有用「说明」代替「呈现」？
                    · 伏笔：埋了的要记得回收，别自己忘了。

                    几条底线：
                    · 中文输出。写正文时不要解释你在干什么，直接给文字。
                    · 保持作者已有的语感和节奏，别改成你自己的风格。
                    · 指出问题时说清是哪一段、为什么，不要笼统说「可以更好」。
                    · 不确定设定就翻当前项目的「设定」目录，别自己编。
              - id: tool-fs
                name: '@deepseek-ai/dsh-tool-fs'
              - id: tool-fs-search
                name: '@deepseek-ai/dsh-tool-fs-search'
                config:
                  # 必填项（schema required）；与 standard 预设保持一致
                  sampleOverCapGlobResults: false
              - id: tool-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh'
                disabled: !!js process.platform !== 'win32'
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
                disabled: !!js process.platform === 'win32'
              - id: tool-goal
                name: '@deepseek-ai/dsh-tool-goal'
              # ── 联网搜索（2026-11-18 大王要求）──────────────
              # 照 standard 预设的写法；fetch: true 让 web_fetch 也可用。
              - id: tool-web
                name: '@deepseek-ai/dsh-tool-web'
                config:
                  fetch: true
                  searchTimeoutMs: 60000
              # ── 会话搜索（2026-11-18 大王要求）──────────────
              # session_search / session_trace / session_event_* 工具。
              # 写作助手能找回之前聊过的设定；文案助手能翻旧稿讨论。
              - id: tool-session-query
                name: '@deepseek-ai/dsh-tool-session-query'
              - id: compaction
                name: cordis:group
                group: true
                isolate:
                  compaction: true
                config:
                  - id: compaction-basic
                    name: '@deepseek-ai/dsh-compaction-basic'
                  - id: command-compact
                    name: '@deepseek-ai/dsh-command-compact'
